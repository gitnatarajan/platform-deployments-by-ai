apiVersion: v1
kind: Namespace
metadata:
  name: nattuitest
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: nattuitest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
      namespace: nattuitest
    spec:
      containers:
      - name: curl
        image: ubuntu/curl:8.18-26.04
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: curl
  namespace: nattuitest
spec:
  selector:
    app: curl
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
