apiVersion: v1
kind: Namespace
metadata:
  name: alpinetest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
      - name: alpine
        image: "alpine:latest"
        imagePullPolicy: IfNotPresent
