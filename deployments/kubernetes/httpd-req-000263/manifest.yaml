apiVersion: v1
kind: Namespace
metadata:
  name: httpdnov12
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: httpdnov12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
      namespace: httpdnov12
    spec:
      containers:
      - name: httpd
        image: httpd:2.4-alpine3.24
        ports:
        - containerPort: 80
