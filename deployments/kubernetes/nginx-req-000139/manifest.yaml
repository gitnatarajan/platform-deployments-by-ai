apiVersion: v1
kind: Namespace
metadata:
  name: test710ns
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: test710ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      namespace: test710ns
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
