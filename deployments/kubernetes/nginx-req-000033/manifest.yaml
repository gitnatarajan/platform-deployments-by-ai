apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: testns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      namespace: testns
    spec:
      containers:
      - name: nginx
        image: harbor.hpe.local:8888/platform/nginx:latest
        ports:
        - containerPort: 80---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: testns
spec:
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
