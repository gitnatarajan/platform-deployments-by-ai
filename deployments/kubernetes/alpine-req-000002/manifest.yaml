apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine
  namespace: alpinesep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
      namespace: alpinesep
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alpine
  namespace: alpinesep
spec:
  selector:
    app: alpine
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Namespace
metadata:
  name: alpinesep
