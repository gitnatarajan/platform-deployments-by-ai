apiVersion: v1
kind: Namespace
metadata:
  name: test29
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorflow
  namespace: test29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tensorflow
  template:
    metadata:
      labels:
        app: tensorflow
      namespace: test29
    spec:
      containers:
      - name: tensorflow
        image: tensorflow/build:2.19-python3.10
        ports:
        - containerPort: 80
