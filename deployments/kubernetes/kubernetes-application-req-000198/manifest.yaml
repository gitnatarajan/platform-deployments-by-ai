apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes
  namespace: testoct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes
  template:
    metadata:
      labels:
        app: kubernetes
      namespace: testoct
    spec:
      containers:
      - name: kubernetes
        image: curlimages/curl:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: testoct
