apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: testns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      namespace: testns
    spec:
      containers:
      - name: nginx
        image: harbor.hpe.local:8888/platform/nginx:latest
        command:
        - /bin/sh
        - -c
        args:
        - nc -vz 10.25.116.199 5432
        ports:
        - containerPort: 80
