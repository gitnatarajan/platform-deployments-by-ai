apiVersion: v1
kind: Namespace
metadata:
  name: scratchtest
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch
  namespace: scratchtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scratch
  template:
    metadata:
      labels:
        app: scratch
      namespace: scratchtest
    spec:
      containers:
      - name: scratch
        image: scratch:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: scratch
  namespace: scratchtest
spec:
  selector:
    app: scratch
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
