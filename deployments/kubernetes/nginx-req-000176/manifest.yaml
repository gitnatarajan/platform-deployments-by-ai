apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes
  namespace: testweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes
  template:
    metadata:
      labels:
        app: kubernetes
      namespace: testweb
    spec:
      containers:
      - name: nginx
        image: alpine:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes
  namespace: testweb
spec:
  selector:
    app: kubernetes
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: Namespace
metadata:
  name: testweb
