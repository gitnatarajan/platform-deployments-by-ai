apiVersion: v1
kind: Namespace
metadata:
  name: testing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      namespace: testing
    spec:
      containers:
      - name: nginx
        image: harbor.hpe.local:8888/ai-deployments/nginx:latest
