apiVersion: v1
kind: Namespace
metadata:
  name: latnginx---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: latnginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      namespace: latnginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
